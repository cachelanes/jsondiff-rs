name: CodSpeed

on:
  # TODO: path filters for pull_request evaluate all changes in the PR, not per-commit.
  # Consider using dorny/paths-filter for per-commit filtering if this becomes noisy.
  push:
    branches:
      - "main"
    paths:
      - "src/**"
      - "benches/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - ".github/workflows/codspeed.yml"
  pull_request:
    paths:
      - "src/**"
      - "benches/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - ".github/workflows/codspeed.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  codspeed:
    name: Run benchmarks
    # Use CodSpeed's bare-metal macro runners for walltime mode (ARM64 architecture)
    runs-on: codspeed-macro
    steps:
      - uses: actions/checkout@v4

      # Using dtolnay/rust-toolchain + Swatinem/rust-cache instead of moonrepo/setup-rust
      # (CodSpeed's default) because these are the de-facto standard Rust actions and
      # Swatinem/rust-cache properly includes CPU arch in cache keys for ARM64 runners.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
          cache-on-failure: "true"

      - name: Install cargo-codspeed
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-codspeed

      - name: Build the benchmark target(s)
        run: cargo codspeed build

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          # Wall clock mode uses bare-metal macro runners for real-world timing (captures SIMD benefits)
          # Free tier: 600 min/month. If quota becomes tight, consider hybrid approach:
          # - PRs: mode: simulation (free, instruction counts)
          # - main: mode: walltime (authoritative, real timing)
          mode: walltime
          run: cargo codspeed run
